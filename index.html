<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Archive of Matter(s)</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: white;
      color: black;
    }

    .header {
      text-align: center;
      font-size: 36px;
      font-weight: bold;
      padding: 20px;
      border-bottom: 2px solid black;
    }

    .section {
      border-bottom: 2px solid black;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 28px;
    }

    .yellow-bar {
      background-color: #FFD700;
      color: black;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      justify-content: space-around;
      align-items: center;
      height: 40px;
      border-top: 2px solid black;
    }

    .symbol {
      font-size: 24px;
      margin-left: 10px;
    }
  </style>
</head>
<body>

  <div class="header">
    Archive of Matter(s)
  </div>

  <div class="section">
    <span>COPPER <span class="symbol">●</span></span>
    <span>→ CONDUCTOR II</span>
  </div>

  <div class="section">
    <span>DUST <span class="symbol">⸰⸰</span></span>
    <span>GHOSTLY OBJECT</span>
  </div>

  <div class="section">
    <span>WEATHER</span>
    <span style="font-size: 40px;">⬭</span>
    <span>EMBODIED</span>
  </div>

  <div class="section">
    <span>HUMAN <span class="symbol">◐</span></span>
  </div>

  <div class="section">
    <span>HUMAN</span>
  </div>

  <div class="yellow-bar">
    <span>KNOWLEDGEMENT</span>
    <span>SIGNALS</span>
    <span>SEDIMENTS</span>
    <span>CONTACT ZONE</span>
  </div>

</body>
</html>
