<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Archive of Matter(s)</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
      background-color: white;
      color: black;
      overflow: hidden;
    }

    .section {
      flex: 1;
      border-bottom: 2px solid black;
      padding-left: 40px;
      padding-right: 20px;
      display: flex;
      justify-content: flex-start; /* 기본 왼쪽 정렬 */
      align-items: center;
      font-size: 5vw;
      transition: background-color 0.3s ease, color 0.3s ease;
      cursor: pointer;
    }

    .header-section {
      flex: 2;
      font-size: 9vw;
      font-weight: bold;
      justify-content: center; /* 헤더만 가운데 정렬 */
    }

    .content {
      height: calc(100% - 40px); /* footer 제외 */
      display: flex;
      flex-direction: column;
    }

    .yellow-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #FFD700;
      color: black;
      font-size: 1.2vw;
      font-weight: bold;
      display: flex;
      justify-content: space-around;
      align-items: center;
      height: 40px;
      border-top: 2px solid black;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
  </style>
</head>
<body>

  <div class="content">
    <div class="section header-section" data-color="#000000" data-invert="true">
      Archive of Matter(s)
    </div>

    <div class="section" data-color="#D2691E">
      <span>COPPER → CONDUCTOR II</span>
    </div>

    <div class="section" data-color="#A9A9A9">
      <span>DUST GHOSTLY OBJECT</span>
    </div>

    <div class="section" data-color="#87CEEB">
      <span>WEATHER EMBODIED</span>
    </div>

    <div class="section" data-color="#D8BFD8">
      <span>HUMAN</span>
    </div>

    <div class="section" data-color="#D8BFD8">
      <span>HUMAN</span>
    </div>
  </div>

  <div class="yellow-bar" id="footer-bar">
    <span>KNOWLEDGEMENT</span>
    <span>SIGNALS</span>
    <span>SEDIMENTS</span>
    <span>CONTACT ZONE</span>
  </div>

  <script>
    const sections = document.querySelectorAll('.section');
    const footer = document.getElementById('footer-bar');
    const defaultFooterColor = '#FFD700';
    const defaultFooterTextColor = 'black';

    sections.forEach(section => {
      const color = section.getAttribute('data-color');
      const invert = section.getAttribute('data-invert') === 'true';

      section.addEventListener('mouseenter', () => {
        section.style.backgroundColor = color;
        footer.style.backgroundColor = color;

        if (invert) {
          section.style.color = 'white';
          footer.style.color = 'white';
        }
      });

      section.addEventListener('mouseleave', () => {
        section.style.backgroundColor = 'white';
        section.style.color = 'black';
        footer.style.backgroundColor = defaultFooterColor;
        footer.style.color = defaultFooterTextColor;
      });
    });
  </script>

</body>
</html>
