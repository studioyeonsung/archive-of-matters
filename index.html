<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Archive of Matter(s)</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
      background-color: white;
      color: black;
      overflow: hidden;
    }

    .header {
      height: 20%;
      text-align: center;
      font-size: 9vw; /* 반응형 폰트 */
      font-weight: bold;
      border-bottom: 2px solid black;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .content {
      height: calc(80% - 40px); /* 노란바 제외한 나머지 */
      display: flex;
      flex-direction: column;
    }

    .section {
      flex: 1;
      border-bottom: 2px solid black;
      padding-left: 40px;     /* 왼쪽 여백을 더 크게 */
      padding-right: 20px;    /* 오른쪽은 그대로 */
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 5vw; /* 반응형 폰트 */
    }

    .symbol {
      font-size: 2.5vw;
      margin-left: 0.5vw;
    }

    .yellow-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #FFD700;
      color: black;
      font-size: 1.2vw; /* 반응형 폰트 */
      font-weight: bold;
      display: flex;
      justify-content: space-around;
      align-items: center;
      height: 40px;
      border-top: 2px solid black;
    }
  </style>
</head>
<body>

  <div class="header">
    Archive of Matter(s)
  </div>

  <div class="content">
    <div class="section">
      <span>COPPER → CONDUCTOR II</span></span>
    </div>

    <div class="section">
      <span>DUST GHOSTLY OBJECT</span></span>
    </div>

    <div class="section">
      <span>WEATHER EMBODIED</span>
    </div>

    <div class="section">
      <span>HUMAN</span>
    </div>

    <div class="section">
      <span>HUMAN</span>
    </div>
  </div>

  <div class="yellow-bar">
    <span>KNOWLEDGEMENT</span>
    <span>SIGNALS</span>
    <span>SEDIMENTS</span>
    <span>CONTACT ZONE</span>
  </div>

</body>
</html>
