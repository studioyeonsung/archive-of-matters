name: Update copper price

on:
  schedule:
    # GitHub minimum interval (5 min). Commits only when price changes.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch copper price (HG=F)
        run: node scripts/fetch-copper-price.js

      - name: Commit if copper data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- copper/price.json copper/history-1y.json; then
            echo "No change to copper data — skip commit"
            exit 0
          fi

          PRICE=$(node -e "console.log(require('./copper/price.json').price.toFixed(3))")
          git add copper/price.json copper/history-1y.json
          git commit -m "Update copper price and 1y history (HG=F \$${PRICE}/lb)"
          git push
